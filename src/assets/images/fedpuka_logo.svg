<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="100%" height="100%">
  <defs>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15" />
    </filter>
    <path id="text-arc" d="M 68 200 A 132 132 0 0 1 332 200" fill="none" />
    <path id="ribbon-arc" d="M 40 375 Q 200 340 360 375" fill="none" />
  </defs>

  <!-- Outer Cogwheel (14 teeth) -->
  <g fill="#0e8a44" stroke="#065f2c" stroke-width="2" filter="url(#subtle-shadow)">
    <!-- Central wheel circle base -->
    <circle cx="200" cy="200" r="148" />
    
    <!-- Cog teeth around circle -->
    <!-- 0 deg -->
    <rect x="184" y="40" width="32" height="24" rx="3" transform="rotate(0 200 200)" />
    <!-- 25.7 deg -->
    <rect x="184" y="40" width="32" height="24" rx="3" transform="rotate(25.7 200 200)" />
    <!-- 51.4 deg -->
    <rect x="184" y="40" width="32" height="24" rx="3" transform="rotate(51.4 200 200)" />
    <!-- 77.1 deg -->
    <rect x="184" y="40" width="32" height="24" rx="3" transform="rotate(77.1 200 200)" />
    <!-- 102.8 deg -->
    <rect x="184" y="40" width="32" height="24" rx="3" transform="rotate(102.8 200 200)" />
    <!-- 128.5 deg -->
    <rect x="184" y="40" width="32" height="24" rx="3" transform="rotate(128.5 200 200)" />
    <!-- 154.2 deg -->
    <rect x="184" y="40" width="32" height="24" rx="3" transform="rotate(154.2 200 200)" />
    <!-- 180 deg -->
    <rect x="184" y="40" width="32" height="24" rx="3" transform="rotate(180 200 200)" />
    <!-- 205.7 deg -->
    <rect x="184" y="40" width="32" height="24" rx="3" transform="rotate(205.7 200 200)" />
    <!-- 231.4 deg -->
    <rect x="184" y="40" width="32" height="24" rx="3" transform="rotate(231.4 200 200)" />
    <!-- 257.1 deg -->
    <rect x="184" y="40" width="32" height="24" rx="3" transform="rotate(257.1 200 200)" />
    <!-- 282.8 deg -->
    <rect x="184" y="40" width="32" height="24" rx="3" transform="rotate(282.8 200 200)" />
    <!-- 308.5 deg -->
    <rect x="184" y="40" width="32" height="24" rx="3" transform="rotate(308.5 200 200)" />
    <!-- 334.2 deg -->
    <rect x="184" y="40" width="32" height="24" rx="3" transform="rotate(334.2 200 200)" />
  </g>

  <!-- Inner White Field -->
  <circle cx="200" cy="200" r="115" fill="#ffffff" stroke="#0e8a44" stroke-width="4" />

  <!-- Arched Institution Name Inside Green Band -->
  <path id="namePath" d="M 85 205 A 115 115 0 0 1 315 205" fill="none" />
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="19" fill="#ffffff" letter-spacing="2">
    <textPath href="#namePath" startOffset="50%" text-anchor="middle">
      FEDERAL POLYTECHNIC, UKANA
    </textPath>
  </text>

  <!-- Central Crest Symbols -->
  <g id="symbols" transform="translate(200, 205)">
    <!-- Crossed Hammer and Spanner Wrench (in orange #e65100) -->
    <!-- Hammer tilted left -->
    <g transform="rotate(-35) translate(-10, -50)">
      <rect x="6" y="0" width="8" height="65" fill="#e65100" rx="2" />
      <path d="M -6 0 L 26 0 L 24 16 L -4 16 Z" fill="#e65100" />
    </g>
    <!-- Spanner wrench tilted right -->
    <g transform="rotate(35) translate(10, -50)">
      <rect x="-14" y="0" width="8" height="65" fill="#e65100" rx="2" />
      <!-- Open wrench jaw -->
      <path d="M -22 0 C -22 -14 -6 -14 -6 0 L -10 5 C -10 0 -18 0 -18 5 Z" fill="#e65100" />
    </g>

    <!-- Communication Mast / Antenna Tower (Center) -->
    <g fill="#e65100" stroke="#e65100" stroke-width="1.5">
      <!-- Truss legs -->
      <line x1="-14" y1="15" x2="-3" y2="-70" />
      <line x1="14" y1="15" x2="3" y2="-70" />
      <line x1="-12" y1="5" x2="12" y2="5" />
      <line x1="-9" y1="-15" x2="9" y2="-15" />
      <line x1="-7" y1="-35" x2="7" y2="-35" />
      <line x1="-5" y1="-55" x2="5" y2="-55" />
      <!-- Cross diagonals -->
      <line x1="-12" y1="5" x2="9" y2="-15" />
      <line x1="12" y1="5" x2="-9" y2="-15" />
      <line x1="-9" y1="-15" x2="7" y2="-35" />
      <line x1="9" y1="-15" x2="-7" y2="-35" />
      <!-- Dishes / Transmitters at top -->
      <path d="M -14 -82 C -22 -82 -24 -70 -16 -66 L -2 -70 Z" fill="#e65100" />
      <path d="M 14 -82 C 22 -82 24 -70 16 -66 L 2 -70 Z" fill="#e65100" />
      <circle cx="0" cy="-78" r="3" fill="#e65100" />
    </g>

    <!-- Open Book at bottom center -->
    <g fill="#ffffff" stroke="#e65100" stroke-width="2.5">
      <!-- Book spine & pages -->
      <path d="M 0 10 C -25 -5 -60 -2 -75 14 L -75 32 C -55 18 -20 18 0 30 C 20 18 55 18 75 32 L 75 14 C 60 -2 25 -5 0 10 Z" fill="#ffffff" />
      <path d="M 0 10 L 0 30" stroke="#e65100" stroke-width="2" />
      <!-- Page lines -->
      <path d="M -60 16 C -40 8 -20 8 -8 16" stroke="#e65100" stroke-width="1.5" fill="none" />
      <path d="M -60 22 C -40 14 -20 14 -8 22" stroke="#e65100" stroke-width="1.5" fill="none" />
      <path d="M 60 16 C 40 8 20 8 8 16" stroke="#e65100" stroke-width="1.5" fill="none" />
      <path d="M 60 22 C 40 14 20 14 8 22" stroke="#e65100" stroke-width="1.5" fill="none" />
    </g>
  </g>

  <!-- Banner Ribbon at the base -->
  <!-- Orange folded swallowtail ribbon tails -->
  <g fill="#e65100">
    <path d="M 40 375 L 15 365 L 20 405 L 55 395 Z" />
    <path d="M 360 375 L 385 365 L 380 405 L 345 395 Z" />
  </g>
  <!-- Main white banner with black border -->
  <path d="M 35 375 C 130 315 270 315 365 375 L 350 405 C 260 345 140 345 50 405 Z" fill="#ffffff" stroke="#1f2937" stroke-width="2.5" />
  
  <!-- Motto on the ribbon -->
  <path id="mottoPath" d="M 45 390 C 135 330 265 330 355 390" fill="none" />
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="11.5" fill="#0e8a44" letter-spacing="1">
    <textPath href="#mottoPath" startOffset="50%" text-anchor="middle">
      SKILLS FOR EXCELLENCE AND SELF RELIANCE
    </textPath>
  </text>
</svg>
